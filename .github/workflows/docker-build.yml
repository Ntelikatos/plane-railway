name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build proxy image
        uses: docker/build-push-action@v7
        with:
          context: proxy
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
