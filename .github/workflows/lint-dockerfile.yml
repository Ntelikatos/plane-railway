name: Lint Dockerfile

on:
  push:
    branches: [main]
    paths: [proxy/Dockerfile]
  pull_request:
    branches: [main]
    paths: [proxy/Dockerfile]

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: proxy/Dockerfile
